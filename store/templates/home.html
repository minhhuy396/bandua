{% extends "base.html" %}

{% block content %}

<style>

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

/* Tiêu đề */
.title{
    text-align:center;
    font-size:42px;
    margin-bottom:40px;
    color:#2e8b57;
    animation: fadeDown 1s ease;
}

/* Grid sản phẩm */
.product-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(230px,1fr));
    gap:25px;
}

/* Card sản phẩm */
.product-card{
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 6px 15px rgba(0,0,0,0.1);
    text-align:center;
    transition:0.3s;
    animation: fadeUp 0.8s ease;
}

/* Hover card */
.product-card:hover{
    transform: translateY(-8px);
    box-shadow:0 12px 25px rgba(0,0,0,0.2);
}

/* Ảnh */
.product-card img{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:10px;
    transition:0.4s;
}

/* Zoom ảnh khi hover */
.product-card:hover img{
    transform:scale(1.08);
}

/* Tên */
.product-card h3{
    margin-top:10px;
    font-size:18px;
}

/* Giá */
.price{
    color:#e53935;
    font-weight:bold;
    margin:10px 0;
    font-size:18px;
}

/* Nút */
.btn{
    background:#ff9800;
    color:white;
    padding:9px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#e68900;
    transform:scale(1.05);
}

/* Animation */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

<div class="container">

<h1 class="title">🥥 Các loại dừa Bến Tre</h1>

<div class="product-grid">

{% for product in products %}

<div class="product-card">

<img src="{{ product.image.url }}">

<h3>{{ product.name }}</h3>

<p class="price">{{ product.price }} đ</p>

<a href="{% url 'product_detail' product.id %}">
<button class="btn">Xem chi tiết</button>
</a>

</div>

{% endfor %}

</div>

</div>

{% endblock %}
