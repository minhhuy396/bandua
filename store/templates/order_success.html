<!DOCTYPE html>
<html>
<head>
<title>Đặt hàng thành công</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
text-align:center;
padding-top:100px;
}

.box{
background:white;
padding:40px;
width:400px;
margin:auto;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

a{
display:inline-block;
margin-top:20px;
padding:10px 20px;
background:#2e8b57;
color:white;
text-decoration:none;
border-radius:6px;
}

</style>

</head>

<body>

<div class="box">

<h2>🎉 Đặt hàng thành công</h2>

<p>Cảm ơn bạn đã mua hàng.</p>

<a href="/">Quay lại trang chủ</a>

</div>

</body>
</html>
