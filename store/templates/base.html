{% load static %}
<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>Shop Dừa Bến Tre</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

/* HEADER */

header{
    background:#2e8b57;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:white;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
    transition:0.3s;
}

nav a:hover{
    color:#ffeb3b;
}

/* USER */

.user{
    color:white;
    margin-left:20px;
}

/* CONTENT */

main{
    min-height:70vh;
}

/* FOOTER */

footer{
    background:#2e8b57;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:40px;
}

</style>

</head>

<body>

<header>

<div class="logo">
🥥 Shop Dừa Bến Tre
</div>

<nav>

<a href="/">Trang chủ</a>
<a href="/about/">Thông tin</a>
<a href="/contact/">Liên hệ</a>
<a href="/cart/">Giỏ hàng</a>

{% if user.is_authenticated %}

<span class="user">
Xin chào {{ user.username }}
</span>

<a href="{% url 'logout' %}">
Đăng xuất
</a>

{% else %}

<a href="{% url 'login' %}">
Đăng nhập
</a>

<a href="{% url 'register' %}">
Đăng ký
</a>

{% endif %}

</nav>

</header>


<main>

{% block content %}
{% endblock %}

</main>


<footer>
© 2026 Shop Dừa Bến Tre
</footer>

</body>

</html>
