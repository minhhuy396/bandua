{% extends "base.html" %}
{% load static %}

{% block content %}

<style>

.container{
    max-width:1100px;
    margin:auto;
    padding:50px 20px;
}

/* Card sản phẩm */

.product-card{
    background:white;
    border-radius:15px;
    padding:40px;
    display:flex;
    gap:50px;
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
    animation:fadeUp 1s ease;
}

/* Ảnh */

.left img{
    width:420px;
    border-radius:12px;
    transition:0.4s;
}

.left img:hover{
    transform:scale(1.05);
}

/* Bên phải */

.right{
    flex:1;
}

.right h1{
    font-size:34px;
    margin-bottom:10px;
}

/* Giá */

.price{
    font-size:30px;
    color:#e53935;
    font-weight:bold;
    margin:15px 0;
}

/* Số lượng */

.quantity{
    margin:20px 0;
}

.quantity input{
    width:70px;
    padding:6px;
    font-size:16px;
    text-align:center;
    border-radius:5px;
    border:1px solid #ccc;
}

/* Nút */

.btn-cart{
    background:#ff9800;
    border:none;
    padding:12px 25px;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
    color:white;
    transition:0.3s;
}

.btn-cart:hover{
    background:#e68900;
    transform:scale(1.05);
}

/* Mô tả */

.description{
    margin-top:30px;
    padding-top:20px;
    border-top:1px solid #eee;
}

/* Quay lại */

.back-link{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    color:#2e8b57;
    font-weight:bold;
}

.back-link:hover{
    text-decoration:underline;
}

/* Animation */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>


<div class="container">

<div class="product-card">

<div class="left">
<img src="{{ product.image.url }}" alt="{{ product.name }}">
</div>

<div class="right">

<h1>{{ product.name }}</h1>

<div class="price">
{{ product.price }} đ
</div>

<form action="{% url 'add_to_cart' product.id %}" method="POST">
{% csrf_token %}

<div class="quantity">
<label>Số lượng:</label>
<input type="number" name="quantity" value="1" min="1">
</div>

<button type="submit" class="btn-cart">
🛒 Thêm vào giỏ hàng
</button>

</form>

<div class="description">
<h3>Mô tả sản phẩm</h3>
<p>{{ product.description }}</p>
</div>

<a class="back-link" href="/">
⬅ Quay lại
</a>

</div>

</div>

</div>

{% endblock %}
