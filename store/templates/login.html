{% extends "base.html" %}

{% block content %}

<style>
.auth-container{
    display:flex;
    justify-content:center;
    align-items:center;
    height:80vh;
}

.auth-box{
    width:350px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    text-align:center;
}

.auth-box h2{
    margin-bottom:20px;
}

.auth-box input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
}

.auth-box button{
    width:100%;
    padding:10px;
    background:#2e8b57;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.auth-box button:hover{
    background:#256d46;
}

.auth-box a{
    display:block;
    margin-top:15px;
}
</style>

<div class="auth-container">

<div class="auth-box">

<h2>Đăng nhập</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Tên tài khoản" required>

    <input type="password" name="password" placeholder="Mật khẩu" required>

    <button type="submit">Đăng nhập</button>

</form>

<a href="{% url 'register' %}">Chưa có tài khoản? Đăng ký</a>

</div>

</div>

{% endblock %}
